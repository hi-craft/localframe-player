name: LocalFrame
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
packages:
  LocalLibraryCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LocalFrame:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: UITests/Fixtures/ui-preview.mp4
        optional: true
        buildPhase: resources
    dependencies:
      - package: LocalLibraryCore
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: AudioToolbox.framework
      - sdk: OpenGLES.framework
      - sdk: CoreGraphics.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: libc++.tbd
      - sdk: libxml2.tbd
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localframe.player
        PRODUCT_NAME: LocalFrame
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "13"
        "EXCLUDED_SOURCE_FILE_NAMES[config=Release]": "ui-preview.mp4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridge/LocalFrame-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        "HEADER_SEARCH_PATHS[sdk=iphoneos*]": '$(inherited) "$(PROJECT_DIR)/Vendor/MobileVLCKit.xcframework/ios-arm64_armv7_armv7s/MobileVLCKit.framework/Headers"'
        "HEADER_SEARCH_PATHS[sdk=iphonesimulator*]": '$(inherited) "$(PROJECT_DIR)/Vendor/MobileVLCKit.xcframework/ios-arm64_x86_64-simulator/MobileVLCKit.framework/Headers"'
        OTHER_LDFLAGS: '$(inherited) -ObjC'
    scheme:
      gatherCoverageData: false
      testTargets:
        - LocalFrameTests
        - LocalFrameUITests
  LocalFrameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LocalFrame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localframe.player.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridge/LocalFrame-Bridging-Header.h
  LocalFrameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes: [Fixtures]
    dependencies:
      - target: LocalFrame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localframe.player.uitests
        GENERATE_INFOPLIST_FILE: YES
