name: LocalFrame
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
packages:
  LocalLibraryCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LocalFrame:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: LocalLibraryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localframe.player
        PRODUCT_NAME: LocalFrame
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridge/LocalFrame-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        HEADER_SEARCH_PATHS: '$(inherited) "$(PODS_XCFRAMEWORKS_BUILD_DIR)/MobileVLCKit/MobileVLCKit.framework/Headers"'
    scheme:
      gatherCoverageData: false
      testTargets:
        - LocalFrameTests
  LocalFrameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LocalFrame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localframe.player.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridge/LocalFrame-Bridging-Header.h
